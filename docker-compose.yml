services:
  # ==============================================================================
  # Trade Compass Core Application (Node.js API + Python Agent + Background Daemons)
  # ==============================================================================
  trade-compass:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-compass-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/tradeflow.db?connection_limit=1&timeout=20000
      - IB_HOST=ib-gateway
    env_file:
      - .env.local
    volumes:
      # Persist the SQLite database across container upgrades and reboots
      - tradeflow-data:/app/data
      - ./tradeflow.db:/app/tradeflow.db
    depends_on:
      - ib-gateway
    networks:
      - trade-net

  # ==============================================================================
  # Interactive Brokers Headless Gateway + IBC (Autonomous 24/7 Cloud Connection)
  # ==============================================================================
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-live}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-tradecompass123}
      TIME_ZONE: ${TIME_ZONE:-Europe/London}
      TWOFA_TIMEOUT_ACTION: restart
      READ_ONLY_API: "no"
      AUTO_RESTART_TIME: "11:59 PM"
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:5900:5900"
    networks:
      - trade-net

volumes:
  tradeflow-data:
    driver: local

networks:
  trade-net:
    driver: bridge
